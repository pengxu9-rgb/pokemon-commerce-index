[project]
name = "pokemon-commerce-index"
version = "0.1.0"
description = "Rights-aware Pokémon card offer index and discovery prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["Pillow"]

[project.scripts]
pokemon-index = "pokemon_index.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pokemon_index*"]

[tool.setuptools.package-data]
pokemon_index = ["*.sql", "collector-character-affiliations-v1.json", "collector-release-name-aliases-v1.json"]
