name: Catalog build and tests

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests and rebuild pinned catalog
        run: python -m unittest discover -s tests -q
      - name: Build staging image from the same manifest
        run: docker build -t pokemon-commerce-index:verify .
