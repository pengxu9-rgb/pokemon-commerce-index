name: Catalog build and tests

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests and rebuild pinned catalog
        run: python -m unittest discover -s tests -q
      - name: Validate the Node caller contracts
        run: node --test integrations/pivota/collectorClient.test.cjs integrations/pivota/collectorOperation.test.cjs
      - name: Rehearse recommendations through Python HTTP and Node
        run: python -m scripts.rehearse_collector_recommendations --output /tmp/recommendation-review-report.json
      - name: Rehearse identity holds against the pinned real catalog
        run: |
          python -m scripts.build_catalog_snapshot --manifest catalog-build-manifest-source-binding-v1.json --db /tmp/review-catalog.sqlite3
          python -m scripts.rehearse_pivota_collector --db /tmp/review-catalog.sqlite3 --suite sandbox/collector_journeys/recommendation-v1/legacy-v2-identity-holds-suite.json --output /tmp/legacy-review-report.json
      - name: Measure bounded real-catalog runtime
        if: ${{ !cancelled() }}
        run: python -m scripts.benchmark_collector_runtime --db /tmp/review-catalog.sqlite3 --output /tmp/runtime-review-report.json
      - name: Build staging image from the same manifest
        id: container_build
        if: ${{ !cancelled() }}
        run: docker build -t pokemon-commerce-index:verify .
      - name: Verify read-only collector behavior inside the image
        if: ${{ !cancelled() && steps.container_build.outcome == 'success' }}
        run: |
          docker run --pull=never --rm -i pokemon-commerce-index:verify python - <<'PY'
          import json
          from contextlib import closing
          from pokemon_index import core, collector_journey
          with closing(core.connect('/app/catalog.sqlite3', readonly=True)) as db:
              result = collector_journey.replay(db, {'turns': [
                  {'type': 'ask', 'question': 'Recommend Japanese Mew cards'},
                  {'type': 'refine', 'scope': {'set_code': 'SV4A'}}], 'limit': 50})
              ids = {card['card_id'] for card in result['candidate_cards']}
              assert {'ja:SV4A:327/190:holo', 'ja:SV4A:347/190:holo'} <= ids
              assert result['purchase_ready'] is False and result['public_display_allowed'] is False
              assert result['prices'] == [] and result['live_offers'] == []
              print(json.dumps({'container_catalog_smoke': 'passed', 'candidate_ids': sorted(ids)}))
          PY
      - name: Audit the supported collector cohort and broad research tasks
        if: ${{ !cancelled() }}
        run: python -m scripts.audit_supported_collector_pilot --db /tmp/review-catalog.sqlite3 --output /tmp/pilot-review-report.json
      - name: Preserve independent diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-review-receipts
          path: |
            /tmp/recommendation-review-report.json
            /tmp/legacy-review-report.json
            /tmp/pilot-review-report.json
            /tmp/runtime-review-report.json
          if-no-files-found: ignore
