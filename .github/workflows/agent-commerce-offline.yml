name: Agent commerce offline checks

on:
  push:
  pull_request:

jobs:
  commerce-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise source, selection, freshness and loopback contracts offline
        run: python -m unittest tests.test_marketplace_sources tests.test_marketplace_crawl tests.test_marketplace_browser tests.test_commerce_loop tests.test_commerce_service tests.test_psa_cert tests.test_commerce_psa -q
      - name: Validate browser resource and DNS restrictions without opening a browser
        run: node --test integrations/browser/renderPublicPage.test.cjs
