name: Agent commerce offline checks

on:
  push:
  pull_request:

jobs:
  commerce-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise source, selection, freshness and loopback contracts offline
        run: python -m unittest tests.test_marketplace_sources tests.test_marketplace_crawl tests.test_marketplace_browser tests.test_commerce_loop tests.test_commerce_service tests.test_psa_cert tests.test_commerce_psa tests.test_provider_smoke tests.test_provider_smoke_psa tests.test_bounded_buyship tests.test_bns_errors tests.test_bns_url_preview -q
      - name: Validate browser resource and DNS restrictions without opening a browser
        run: node --test integrations/browser/renderPublicPage.test.cjs
      - name: Exercise official eBay gates, prices, seller and identity evidence offline
        run: python -m unittest tests.test_ebay_official tests.test_ebay_price_pilot tests.test_ebay_commerce_integration tests.test_ebay_service_configuration tests.test_marketplace_connections tests.test_listing_evidence tests.test_grade_evidence tests.test_seller_evidence -q
      - name: Exercise guarded source registration and full loopback quote journey without external network
        run: python -B -m unittest tests.test_live_offer_pilot -q
      - name: Audit saved card, image and seller-photo coverage without providers
        run: python -m unittest tests.test_image_coverage tests.test_cohort_coverage tests.test_offer_coverage -q
